<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>本地大模型对话</title>
<script>
/* 在首次绘制之前定好主题，避免刷新时先闪一下浅色底再切过去。
   这段必须内联：外链脚本要等下载完才执行，那时页面已经画出来了。 */
(function () {
  var pref = localStorage.getItem("aiu.theme") || "system";
  var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme =
    pref === "system" ? (dark ? "dark" : "light") : pref;
})();
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="brand">
    <span class="avatar">AI</span>
    <div>
      <h1>本地大模型对话</h1>
      <p class="sub"><span id="status-dot" class="dot"></span><span id="status">连接中…</span></p>
    </div>
  </div>
  <div class="actions">
    <button id="theme" title="切换配色：跟随系统 / 浅色 / 深色">跟随系统</button>
    <button id="clear">清空上下文</button>
  </div>
</header>

<main id="messages">
  <div class="thread" id="thread">
    <p class="empty">
      <strong>本地模型已就绪</strong>
      输入问题开始对话 · Enter 发送，Shift + Enter 换行
    </p>
  </div>
</main>

<footer>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="输入问题…"></textarea>
    <button id="send">发送</button>
  </div>
  <p class="hint">回复由本地模型生成，可能有误，请自行核实。</p>
</footer>

<script type="module" src="app.js"></script>
</body>
</html>
