<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>本地大模型对话</title>
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --line: #e2e5ea;
    --text: #1f2328; --muted: #6b7280; --accent: #2563eb; --danger: #b42318;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; display: flex; flex-direction: column;
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }

  /* ---------- 顶栏 ---------- */
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 18px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  header h1 { margin: 0; font-size: 15px; font-weight: 600; }
  .meta { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--muted); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #9ca3af; margin-right: 6px; }
  .dot.ok { background: #16a34a; } .dot.bad { background: var(--danger); }
  button {
    font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 8px;
    border: 1px solid var(--line); background: #fff; color: var(--text); cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: #c7ccd4; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  #send { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* ---------- 消息区 ---------- */
  #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .bubble {
    max-width: min(760px, 82%); padding: 10px 14px; border-radius: 12px;
    background: var(--panel); border: 1px solid var(--line);
    line-height: 1.65; white-space: pre-wrap; word-break: break-word;
  }
  .row.user .bubble { background: var(--accent); border-color: var(--accent); color: #fff; }
  .bubble.error { border-color: #f0b4ae; background: #fef3f2; color: var(--danger); }
  .bubble.pending::after { content: "▌"; color: var(--muted); animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .empty { margin: auto; text-align: center; color: var(--muted); font-size: 14px; line-height: 1.9; }

  /* ---------- 输入区 ---------- */
  footer {
    display: flex; gap: 10px; align-items: flex-end;
    padding: 12px 18px; background: var(--panel); border-top: 1px solid var(--line);
  }
  textarea {
    flex: 1; resize: none; max-height: 160px; padding: 10px 12px;
    font: inherit; line-height: 1.5; color: var(--text);
    border: 1px solid var(--line); border-radius: 10px; background: #fff; outline: none;
  }
  textarea:focus { border-color: var(--accent); }
</style>
</head>
<body>

<header>
  <h1>本地大模型对话</h1>
  <div class="meta">
    <span><span id="status-dot" class="dot"></span><span id="status">连接中…</span></span>
    <button id="clear">清空上下文</button>
  </div>
</header>

<main id="messages">
  <p class="empty">本地模型已就绪，输入问题开始对话。<br>Enter 发送，Shift + Enter 换行。</p>
</main>

<footer>
  <textarea id="input" rows="1" placeholder="输入问题…"></textarea>
  <button id="send">发送</button>
</footer>

<script>
/* 前端只做两件事：
     1. 组织 UI —— 渲染气泡、更新状态、处理输入
     2. 订阅后端推送的事件流 —— 收到什么就画什么

   不拼接 prompt、不维护对话历史、不判断模型是否可用：
   这些都在后端，前端通过 SSE 事件拿结果。 */

const els = {
  messages: document.getElementById("messages"),
  input: document.getElementById("input"),
  send: document.getElementById("send"),
  clear: document.getElementById("clear"),
  status: document.getElementById("status"),
  dot: document.getElementById("status-dot"),
};

/* ---------- 会话标识 ---------- */
// 存在浏览器本地，后端据此找回对话上下文；换浏览器/清缓存即是一段新对话
const SESSION_KEY = "aiu.session_id";

function newSessionId() {
  // crypto.randomUUID 只在安全上下文（localhost 或 HTTPS）可用，这里留个降级
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return "s-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
}

const sessionId = localStorage.getItem(SESSION_KEY) || (() => {
  const id = newSessionId();
  localStorage.setItem(SESSION_KEY, id);
  return id;
})();

/* ---------- UI ---------- */
let busy = false;

function clearEmptyHint() {
  const hint = els.messages.querySelector(".empty");
  if (hint) hint.remove();
}

function addBubble(role, text) {
  clearEmptyHint();
  const row = document.createElement("div");
  row.className = "row " + role;
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text || "";
  row.appendChild(bubble);
  els.messages.appendChild(row);
  els.messages.scrollTop = els.messages.scrollHeight;
  return bubble;
}

function appendText(bubble, chunk) {
  bubble.textContent += chunk;
  els.messages.scrollTop = els.messages.scrollHeight;
}

function setStatus(text, state) {
  els.status.textContent = text;
  els.dot.className = "dot" + (state ? " " + state : "");
}

function setBusy(value) {
  busy = value;
  els.send.disabled = value;
  els.send.textContent = value ? "生成中…" : "发送";
}

/* ---------- 事件流的消费 ---------- */
// 后端推送的是 SSE 报文：以 "data: {json}" 为单位、空行分隔
function handleEvent(rawEvent, bubble) {
  const dataLine = rawEvent.split("\n").find((line) => line.startsWith("data:"));
  if (!dataLine) return;

  let event;
  try {
    event = JSON.parse(dataLine.slice(5).trim());
  } catch {
    return; // 半截报文，交给下一轮缓冲拼接
  }

  if (event.type === "delta") {
    appendText(bubble, event.content);
  } else if (event.type === "error") {
    bubble.classList.add("error");
    appendText(bubble, event.message);
  }
  // type === "done" 表示本轮结束，无需额外处理
}

async function consumeStream(body, bubble) {
  const reader = body.getReader();
  const decoder = new TextDecoder();
  let buffer = "";

  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });

    const events = buffer.split("\n\n");
    buffer = events.pop(); // 最后一段可能不完整，留到下一轮
    for (const event of events) handleEvent(event, bubble);
  }
}

/* ---------- 交互 ---------- */
async function sendMessage() {
  const text = els.input.value.trim();
  if (!text || busy) return;

  setBusy(true);
  addBubble("user", text);
  const bubble = addBubble("assistant", "");
  bubble.classList.add("pending");

  els.input.value = "";
  autoGrow();

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sessionId, message: text }),
    });

    if (!response.ok || !response.body) {
      throw new Error("HTTP " + response.status);
    }
    await consumeStream(response.body, bubble);
    setStatus("已连接 · " + currentModel, "ok");
  } catch (err) {
    bubble.classList.add("error");
    appendText(bubble, "请求失败：" + err.message);
    setStatus("连接异常", "bad");
  } finally {
    bubble.classList.remove("pending");
    setBusy(false);
    els.input.focus();
  }
}

async function resetSession() {
  try {
    await fetch("/api/session/reset", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sessionId }),
    });
    els.messages.innerHTML =
      '<p class="empty">上下文已清空，开始新的对话吧。</p>';
  } catch {
    appendText(addBubble("assistant", ""), "清空失败，请稍后再试。");
  }
}

/* ---------- 启动时查询服务状态 ---------- */
let currentModel = "";

async function refreshStatus() {
  try {
    const resp = await fetch("/api/health");
    const info = await resp.json();
    if (info.ok) {
      currentModel = info.model;
      setStatus("已连接 · " + info.model, "ok");
    } else {
      currentModel = info.model;
      setStatus("模型服务未就绪", "bad");
    }
  } catch {
    setStatus("后端服务不可用", "bad");
  }
}

/* ---------- 输入框自适应高度 ---------- */
function autoGrow() {
  els.input.style.height = "auto";
  els.input.style.height = Math.min(els.input.scrollHeight, 160) + "px";
}

els.input.addEventListener("input", autoGrow);
els.input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
els.send.addEventListener("click", sendMessage);
els.clear.addEventListener("click", resetSession);

refreshStatus();
els.input.focus();
</script>
</body>
</html>
