<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI GM 跑团</title>
<script>
/* 首次绘制前定好主题，避免刷新时闪一下浅色底 */
(function () {
  var pref = localStorage.getItem("aigm.theme") || "system";
  var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme =
    pref === "system" ? (dark ? "dark" : "light") : pref;
})();
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ 开局界面 ============ -->
<section id="setup" class="setup">
  <div class="setup-card">
    <h1>AI GM 跑团</h1>
    <p class="lead">本地大模型当主持人，骰子由程序来掷</p>

    <label class="field">
      <span>角色名 <em class="req">必填</em></span>
      <input id="hero-name" maxlength="20" value="林默" autocomplete="off">
    </label>

    <div class="field">
      <span>身份</span>
      <div class="choices" id="identities"></div>
    </div>

    <label class="field" id="custom-identity-field" hidden>
      <span>自定义身份名</span>
      <input id="custom-identity" maxlength="16" placeholder="例如：流浪法师" autocomplete="off">
    </label>

    <!-- 只有选「自定义」时才出现 -->
    <div class="field" id="attribute-field" hidden>
      <span>属性分配 <em id="points-left"></em></span>
      <ul class="allocator" id="allocator"></ul>
    </div>

    <div class="field">
      <span>剧本</span>
      <div class="choices" id="scenarios"></div>
    </div>

    <!-- 人设：折叠起来，不填也能直接开始 -->
    <details class="persona-box">
      <summary>人设（选填，留空由 GM 决定）</summary>

      <div class="persona-fields" id="persona-fields"></div>

      <label class="toggle">
        <input type="checkbox" id="complete-persona" checked>
        <span>让 GM 补全空缺并润色</span>
      </label>

      <button id="preview-persona" type="button" class="ghost">生成人设预览</button>
      <p class="hint" id="persona-hint"></p>
    </details>

    <!-- 预览：满意了再开局 -->
    <div class="persona-preview" id="persona-preview" hidden>
      <h4>GM 补全后的人设</h4>
      <ul class="facts" id="preview-facts"></ul>
      <p class="preview-attrs" id="preview-attrs"></p>
      <div class="preview-actions">
        <button id="regenerate" type="button" class="ghost">重新生成</button>
        <button id="close-preview" type="button" class="ghost">收起</button>
      </div>
    </div>

    <button id="start" class="primary">开始冒险</button>
    <p class="hint" id="setup-hint"></p>

    <div class="field saves-field" id="saves-field" hidden>
      <span>继续之前的冒险</span>
      <ul class="saves" id="saves"></ul>
    </div>
  </div>
</section>

<!-- ============ 游戏界面 ============ -->
<div id="play" class="play" hidden>
  <header>
    <div class="brand">
      <h1 id="scenario-title">冒险</h1>
      <p class="sub"><span id="hero-line"></span></p>
    </div>
    <div class="actions">
      <button id="theme" title="切换配色">跟随系统</button>
      <button id="save">存档</button>
      <button id="restart">重开</button>
    </div>
  </header>

  <div class="layout">
    <main id="log" class="log"></main>

    <aside class="sheet">
      <div class="sheet-head">
        <strong id="sheet-name"></strong>
        <span class="tag" id="sheet-background"></span>
      </div>
      <p class="sheet-title" id="sheet-title"></p>

      <div class="hp">
        <div class="hp-bar"><span id="hp-fill"></span></div>
        <span class="hp-text" id="hp-text"></span>
      </div>

      <section class="group" id="group-persona">
        <h3>人设</h3>
        <ul class="facts" id="persona"></ul>
      </section>

      <section class="group" id="group-traits">
        <h3>特质</h3>
        <ul class="list" id="traits"></ul>
      </section>

      <section class="group" id="group-status">
        <h3>状态</h3>
        <ul class="list" id="statuses"></ul>
      </section>

      <section class="group">
        <h3>属性</h3>
        <ul class="attrs" id="attrs"></ul>
      </section>

      <section class="group" id="group-relations">
        <h3>关系</h3>
        <ul class="list" id="relations"></ul>
      </section>

      <section class="group" id="group-items">
        <h3>携带</h3>
        <ul class="list" id="items"></ul>
      </section>

      <section class="group" id="group-notes">
        <h3>线索</h3>
        <ul class="list" id="notes"></ul>
      </section>

      <section class="group">
        <h3>本次冒险</h3>
        <ul class="list" id="meta"></ul>
      </section>
    </aside>
  </div>

  <footer>
    <div class="composer">
      <textarea id="action" rows="1" placeholder="你要做什么？例如：我推门进去"></textarea>
      <button id="submit" class="primary">行动</button>
    </div>
  </footer>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
